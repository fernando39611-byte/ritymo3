    <title>Ritymo</title> 
    <link rel="stylesheet" href="studio.css">
</head>
<body>
  
   <div id="alertaUsuario" class="alerta-usuario" role="status" hidden></div>

    <header>
        <!--Logo-->
       <div class="logo-area">
        <img src="logo.png" alt="logo do site" class="logo">
       </div>
       <!--Menu-->
       <nav class="menu">

       <main class="studio">
    <header class="topbar">

    <div>
     <h1>▣ STUDIO</h1>
    <p>Seu studio sem Limites</p>
    </div>

        <button id="savebutton">Salvar Projeto</button>
    </header>

    
    <section class="projeto">
    <label for="projetoNome">Nome do Projeto</label>
    <input
        type="text"
        id="projetoNome"
        placeholder="Digite o nome do seu projeto"
    >
</section>


    <section class="botoes">
    <button type="button" id="tocar">▶ Tocar</button>
    <button type="button" id="parar">■ Parar</button>

    <label for="bpm">BPM</label>
    <input id="bpm" type="number" min="40" max="240" value="120">

    <button type="button" id="loadbutton">Abrir Projeto</button>
</section>
<input
    type="file"
    id="arquivoProjeto"
    accept=".json,.wav,audio/wav,application/json"
    hidden
>

<div id="audioImportado"></div>

   <section class="sequencia">
    <h2>Sequenciador de Ritmos</h2>
    <p>Ative os quadrados para montar seu ritmo.</p>

    <div id="beatGrid"></div>
</section>

</main>

  <script src="sequenciador.js"></script>
  <script src="projetos.js"></script>
  <script src="salvar-projeto.js"></script>
  
<script>
    const nomeUsuario = sessionStorage.getItem("nomeUsuario");

    if (nomeUsuario) {
        alert(`Você se conectou com o nome ${nomeUsuario}!`);

        sessionStorage.removeItem("nomeUsuario");
    }
</script>
