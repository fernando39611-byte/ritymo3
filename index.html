
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ritymo</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <!-- Logo -->
        <div class="logo-area">
            <img src="logo.png" alt="Logo do Ritymo" class="logo">
        </div>

        <!-- Menu -->
        <nav class="menu">
            <a href="sobre.html">Sobre</a>
            <a href="studio.html">Studio</a>
            <a href="bibli.html">Biblioteca</a>
            <a href="contato.html">Contato</a>
        </nav>

        <!-- Botões de login -->
        <div class="botoes-login">
            <button class="botao-conta"
                onclick="window.location.href='criar.html'">
                Registrar
            </button>

            <button class="botao-entrar"
                onclick="window.location.href='entrar.html'">
                Entrar
            </button>
        </div>
    </header>

    <main>
        <!-- Conteúdo principal -->
        <section class="hero">

            <div class="hero-texto">
                <h2 class="subtitulo">
                    ◆ Crie seu som e encontre seu ritmo ◆
                </h2>

                <h1 class="titulo">
                    Transforme sua imaginação<br>
                    em realidade.<br>
                    <span>E seus pensamentos em beats</span>
                </h1>

                <!-- Botões principais -->
                <div class="botoes">
                    <button class="botao-criar"
                        onclick="window.location.href='criar.html'">
                        Comece a criar ▇
                    </button>

                    <button class="botao-studio"
                        onclick="window.location.href='studio.html'">
                        Acessar studio ▶
                    </button>
                </div>
            </div>

            <!-- Imagem -->
            <div class="hero-imagem">
                <img src="simbolo.png" alt="Símbolo do Ritymo">
            </div>

        </section>
    </main>

    <!-- Rodapé -->
    <footer class="rodape">
        © 2026 Menfes Tech. Todos os direitos reservados.
    </footer>

</body>
</html>
